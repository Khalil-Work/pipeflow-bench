<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Pipeflow Bench banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#081221"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f4e79"/>
      <stop offset="1" stop-color="#2e6da4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e8b04b"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- pipe cross-section schematic -->
  <g transform="translate(70,60)">
    <rect x="0" y="30" width="460" height="150" rx="18" fill="url(#pipe)" stroke="#5b9bd5" stroke-width="3"/>
    <!-- streamlines: parabolic velocity profile -->
    <path d="M 20 60 C 180 52, 300 52, 440 60" stroke="#7fd1f0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M 20 85 C 180 72, 300 72, 440 85" stroke="#7fd1f0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M 20 105 C 180 105, 300 105, 440 105" stroke="#e8b04b" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
    <path d="M 20 125 C 180 138, 300 138, 440 125" stroke="#7fd1f0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M 20 150 C 180 158, 300 158, 440 150" stroke="#7fd1f0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <!-- pressure drop annotation -->
    <line x1="90" y1="200" x2="390" y2="200" stroke="#b23a48" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="90" y="228" fill="#b23a48" font-family="Segoe UI, Arial, sans-serif" font-size="17">Δp high</text>
    <text x="330" y="228" fill="#b23a48" font-family="Segoe UI, Arial, sans-serif" font-size="17">Δp low</text>
    <text x="165" y="16" fill="#9fb8ce" font-family="Consolas, monospace" font-size="16">1/√f = −2 log₁₀( ε/3.7D + 2.51/Re√f )</text>
  </g>
  <!-- wordmark -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="580" y="140" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="1">Pipeflow <tspan fill="#e8b04b">Bench</tspan></text>
    <text x="582" y="185" fill="#9fb8ce" font-size="22">friction · pressure loss · implicit-solver diagnostics</text>
    <text x="582" y="225" fill="#5b7a99" font-family="Consolas, monospace" font-size="16">Colebrook-White · Darcy-Weisbach · Haaland · Churchill</text>
  </g>
</svg>
